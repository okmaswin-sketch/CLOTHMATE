name: clothmate
description: "ClothMate - Garment Business Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # PDF & Printing
  pdf: ^3.11.2
  printing: ^5.13.4

  # Charts
  fl_chart: ^0.70.2

  # Backup
  archive: ^4.0.2

  # Intl
  intl: ^0.20.2

  # Security
  local_auth: ^2.3.0

  # File picking
  file_picker: ^8.1.7

  # Share
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  image: ^4.9.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
